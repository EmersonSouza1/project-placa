[project]
name = "dock-vision"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3,<9",
  "lap>=0.5.12,<0.6",
  "paddleocr>=3.0,<4",
  "paddlepaddle>=3.0,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dock_vision*"]

